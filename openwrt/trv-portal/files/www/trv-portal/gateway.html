<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hotel WiFi Authentication</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#1a1a2e;color:#eee;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.card{background:#16213e;border-radius:16px;padding:32px 24px;max-width:400px;width:100%;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,0.3)}
.icon{font-size:48px;margin-bottom:16px}
h1{font-size:22px;margin-bottom:8px;color:#e94560}
p{font-size:14px;color:#a0a0b0;margin-bottom:24px;line-height:1.5}
.btn{display:inline-block;background:#e94560;color:#fff;padding:14px 32px;border-radius:8px;text-decoration:none;font-size:16px;font-weight:600;transition:background 0.2s}
.btn:hover{background:#c73652}
.status{margin-top:20px;font-size:13px;color:#6c6;display:none}
.status.show{display:block}
.manual{font-size:12px;color:#666;margin-top:16px}
.manual a{color:#e94560;text-decoration:none}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid #6c6;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
<div class="icon">📶</div>
<h1 id="title">Hotel WiFi Authentication</h1>
<p id="message">This network requires authentication.<br>Tap below to open the hotel portal.</p>
<a id="connect-btn" class="btn" href="/portal_gateway" target="_blank">Open Hotel Portal</a>
<div id="status" class="status"><span class="spinner"></span>Checking internet access...</div>
</div>
<script>
const STATUS_URL = '/trv-portal/status.json';
const INTERVAL = 3000;

function checkStatus() {
  fetch(STATUS_URL)
    .then(r => r.json())
    .then(data => {
      if (data.connected) {
        document.getElementById('status').className = 'status show';
        document.getElementById('status').innerHTML = '✓ Connected! All devices now have internet.';
        document.getElementById('title').textContent = 'Connected';
        document.getElementById('message').textContent = 'You are now online. All devices connected to this router share the connection.';
        document.getElementById('connect-btn').style.display = 'none';
        clearInterval(poll);
      }
    })
    .catch(() => {});
}

let poll = setInterval(checkStatus, INTERVAL);
checkStatus();
</script>
</body>
</html>
